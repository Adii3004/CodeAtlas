services:
  postgres:
    image: postgres:16-alpine
    container_name: codeatlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codeatlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeatlas_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-codeatlas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - codeatlas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codeatlas} -d ${POSTGRES_DB:-codeatlas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.15.1
    container_name: codeatlas-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - codeatlas_qdrant_data:/qdrant/storage
    healthcheck:
      # The qdrant image ships without curl/wget, so probe the HTTP port
      # with bash's built-in /dev/tcp redirection instead.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  codeatlas_postgres_data:
    name: codeatlas_postgres_data
  codeatlas_qdrant_data:
    name: codeatlas_qdrant_data
